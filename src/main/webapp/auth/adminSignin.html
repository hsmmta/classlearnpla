<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="../css/mobile.css">
    <title>管理员登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
        }
        .platform-title {
            text-align: center;
            padding: 30px 0;
            font-size: 28px;
            color: #333;
            font-weight: bold;
        }
        .login-container {
            width: 400px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .admin-badge {
            background-color: #ff4444;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button, input[type="submit"] {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            background-color: #ff4444;
            color: white;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        button:hover, input[type="submit"]:hover {
            background-color: #dd3333;
        }
        .link {
            margin-top: 15px;
            display: block;
            text-align: center;
            color: #0088ff;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
        .info-box {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #856404;
        }
    </style>
    <script>
        function submitAdminLogin() {
            let adminID = document.getElementById("adminID").value.trim();
            let adminPassword = document.getElementById("adminPassword").value.trim();

            // 前端验证
            if (!adminID) {
                alert("请输入管理员账号");
                return false;
            }

            if (!adminPassword) {
                alert("请输入管理员密码");
                return false;
            }

            // 发送登录请求
            let xhr = new XMLHttpRequest();
            xhr.open("POST", "/adminLogin", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            let result = JSON.parse(xhr.responseText);
                            if (result.success) {
                                // 登录成功，跳转到管理员页面
                                window.location.href = result.redirectUrl;
                            } else {
                                // 登录失败
                                alert(result.msg);
                            }
                        } catch (e) {
                            alert("登录响应解析失败");
                        }
                    } else {
                        alert("登录请求失败，状态码：" + xhr.status);
                    }
                }
            };

            xhr.onerror = function() {
                alert("网络错误！登录请求失败");
            };

            let params = "adminID=" + encodeURIComponent(adminID) +
                         "&adminPassword=" + encodeURIComponent(adminPassword);
            xhr.send(params);

            return false;
        }
    </script>
</head>
<body>
<div class="platform-title">班级学习社区平台</div>
<div class="login-container">
    <div style="text-align: center;">
        <span class="admin-badge">管理员登录</span>
    </div>
    <h2 style="text-align: center; margin-bottom: 20px;">管理员专用</h2>

    <div class="info-box">
        <strong>提示：</strong>此入口仅供管理员使用，普通用户请返回用户登录。
    </div>

    <form onsubmit="return submitAdminLogin()">
        管理员账号：<input type="text" id="adminID" name="adminID" placeholder="请输入管理员账号"><br><br>

        管理员密码：<input type="password" id="adminPassword" name="adminPassword" placeholder="请输入管理员密码"><br><br>

        <input type="submit" value="登录">
    </form>

    <a href="/auth/signin.html" class="link">← 返回用户登录</a>
</div>
</body>
</html>
