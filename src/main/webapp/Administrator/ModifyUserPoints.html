<%@ page contentType="text/html;charset=UTF-8" language="java" %>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改用户积分</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 600px;
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.08);
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #0088ff;
        }
        .radio-group {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .radio-item label {
            font-size: 14px;
            color: #666;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #0088ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #0077ee;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            text-decoration: none;
        }
        .back-btn:hover {
            color: #0088ff;
        }
        .info-box {
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #004085;
        }
        .current-points {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .current-points .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .current-points .value {
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="title">修改用户积分</div>

    <div class="info-box">
        <strong>提示：</strong>请先查询用户当前积分，然后选择增加或减少积分。
    </div>

    <form id="queryForm">
        <div class="form-item">
            <label class="form-label">用户ID（手机号） *</label>
            <input type="text" id="userID" name="userID" class="form-input" placeholder="输入用户手机号" required>
        </div>
        <button type="button" onclick="queryUserPoints()" class="submit-btn">查询当前积分</button>
    </form>

    <div id="modifySection" style="display: none; margin-top: 30px; padding-top: 30px; border-top: 2px solid #e9ecef;">
        <div class="current-points">
            <div class="label">当前积分</div>
            <div class="value" id="currentPoints">0</div>
        </div>

        <form onsubmit="return submitModifyPoints()">
            <div class="form-item">
                <label class="form-label">操作类型 *</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="operationAdd" name="operation" value="add" checked>
                        <label for="operationAdd">增加积分</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="operationSub" name="operation" value="subtract">
                        <label for="operationSub">减少积分</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="operationSet" name="operation" value="set">
                        <label for="operationSet">设置积分</label>
                    </div>
                </div>
            </div>

            <div class="form-item">
                <label class="form-label">积分数量 *</label>
                <input type="number" id="pointAmount" name="pointAmount" class="form-input" placeholder="输入积分数量" min="1" required>
            </div>

            <div class="form-item">
                <label class="form-label">操作说明</label>
                <input type="text" id="reason" name="reason" class="form-input" placeholder="说明原因（可选）">
            </div>

            <button type="submit" class="submit-btn">确认修改</button>
        </form>
    </div>

    <a href="javascript:history.back()" class="back-btn">返回</a>
</div>

<script>
    var currentUserID = "";

    function queryUserPoints() {
        var userID = document.getElementById("userID").value.trim();
        if (!userID) {
            alert("请输入用户ID");
            return;
        }

        currentUserID = userID;

        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/queryUserPoints", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    if (result.success) {
                        document.getElementById("currentPoints").innerText = result.points;
                        document.getElementById("modifySection").style.display = "block";
                    } else {
                        alert(result.msg);
                    }
                } catch (e) {
                    alert("响应解析失败");
                }
            }
        };

        xhr.send("userID=" + encodeURIComponent(userID));
    }

    function submitModifyPoints() {
        var operation = document.querySelector('input[name="operation"]:checked').value;
        var pointAmount = document.getElementById("pointAmount").value.trim();
        var reason = document.getElementById("reason").value.trim();

        if (!pointAmount || parseInt(pointAmount) < 1) {
            alert("请输入有效的积分数量");
            return false;
        }

        if (!confirm("确定要修改该用户的积分吗？")) {
            return false;
        }

        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/modifyUserPoints", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var result = JSON.parse(xhr.responseText);
                    alert(result.msg);
                    if (result.success) {
                        // 重新查询积分
                        queryUserPoints();
                        // 清空表单
                        document.getElementById("pointAmount").value = "";
                        document.getElementById("reason").value = "";
                    }
                } catch (e) {
                    alert("响应解析失败");
                }
            }
        };

        var params = "userID=" + encodeURIComponent(currentUserID) +
                     "&operation=" + operation +
                     "&pointAmount=" + pointAmount +
                     "&reason=" + encodeURIComponent(reason);
        xhr.send(params);

        return false;
    }
</script>
</body>
</html>
