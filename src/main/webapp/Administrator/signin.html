<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="../css/mobile.css">
    <title>班级学习社区-管理员登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #12121a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 400px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .login-title {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-subtitle {
            font-size: 12px;
            color: #999999;
            margin-bottom: 30px;
            line-height: 1.4;
            text-align: center;
        }

        .form-label {
            font-size: 14px;
            color: #cccccc;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: #666666;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #0088ff;
            background-color: rgba(255, 255, 255, 0.12);
        }

        button, input[type="submit"] {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #0088ff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover, input[type="submit"]:hover {
            background-color: #0077ee;
        }

        button:disabled {
            background-color: rgba(255, 255, 255, 0.05);
            color: #666;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .radio-group {
            margin: 10px 0 20px 0;
            display: flex;
            gap: 20px;
            color: #cccccc;
            font-size: 14px;
        }

        .radio-group input {
            margin-right: 5px;
            accent-color: #0088ff;
        }

        #sendCodeBtn {
            display: none;
        }
    </style>
    <script>
        // 切换登录方式：密码/验证码
        function switchLoginType(type) {
            let pwdDiv = document.getElementById("pwdDiv");
            let codeDiv = document.getElementById("codeDiv");
            let sendCodeBtn = document.getElementById("sendCodeBtn");

            if (type === "password") {
                pwdDiv.style.display = "block";
                codeDiv.style.display = "none";
                sendCodeBtn.style.display = "none";
            } else {
                pwdDiv.style.display = "none";
                codeDiv.style.display = "block";
                sendCodeBtn.style.display = "block";
            }
        }

        // 发送验证码
        function sendLoginCode() {
            let phone = document.getElementById("userID").value;
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert("请输入正确的11位手机号！");
                return;
            }

            let btn = document.getElementById("sendCodeBtn");
            btn.disabled = true;
            let count = 60;
            btn.innerText = "重新发送(" + count + ")";

            let timer = setInterval(() => {
                count--;
                btn.innerText = "重新发送(" + count + ")";
                if (count === 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "发送验证码";
                }
            }, 1000);

            let xhr = new XMLHttpRequest();
            xhr.open("POST", "/sendCode", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.send("phone=" + phone);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        alert(xhr.responseText);
                    } else {
                        alert("验证码发送失败！请重试");
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.innerText = "发送验证码";
                    }
                }
            };

            xhr.onerror = function() {
                alert("网络错误！验证码发送失败");
                clearInterval(timer);
                btn.disabled = false;
                btn.innerText = "发送验证码";
            };
        }

        function submitLogin() {
            // 1. 手机号格式校验
            let phone = document.getElementById("userID").value;
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert("请输入正确的11位手机号！");
                return false;
            }

            // 2. 获取登录类型和对应参数
            let loginType = document.querySelector('input[name="loginType"]:checked').value;
            let userPassword = document.getElementById("userPassword")?.value || "";
            let code = document.getElementById("code")?.value || "";

            // 3. 校验密码/验证码非空
            let params = "userID=" + encodeURIComponent(phone) + "&loginType=" + encodeURIComponent(loginType);
            if (loginType === "password") {
                if (userPassword.trim() === "") {
                    alert("请输入登录密码！");
                    return false;
                }
                params += "&userPassword=" + encodeURIComponent(userPassword);
            } else {
                if (code.trim() === "") {
                    alert("请输入验证码！");
                    return false;
                }
                params += "&code=" + encodeURIComponent(code);
            }

            // 4. 异步提交登录请求
            let xhr = new XMLHttpRequest();
            xhr.open("POST", "/login", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            let result = JSON.parse(xhr.responseText);
                            if (result.success) {
                                // 直接跳转，无弹窗
                                window.location.href = result.redirectUrl;
                            } else {
                                // 显示后端返回的精准错误信息（如验证码错误、密码错误等）
                                alert(result.msg);
                            }
                        } catch (e) {
                            alert("登录响应解析失败，请重试！");
                        }
                    } else {
                        alert("登录请求失败，HTTP状态码：" + xhr.status);
                    }
                }
            };

            xhr.onerror = function() {
                alert("网络错误！登录请求失败");
            };

            xhr.send(params);
            return false;
        }

        // 页面加载初始化
        window.onload = function() {
            switchLoginType("password");
        };
    </script>
</head>
<body>
<div class="login-container">
    <div class="login-title">管理员登录</div>
    <div class="login-subtitle">仅班级学习社区的班委/教师使用本入口</div>

    <form onsubmit="return submitLogin()">
        <label class="form-label">管理员账号（手机号）</label>
        <input type="text" id="userID" name="userID" placeholder="请输入11位手机号" maxlength="11">

        <div id="pwdDiv">
            <label class="form-label">登录密码</label>
            <input type="password" id="userPassword" name="userPassword" placeholder="请输入登录密码">
        </div>

        <div id="codeDiv" style="display: none;">
            <label class="form-label">验证码</label>
            <input type="text" id="code" name="code" placeholder="请输入6位验证码" maxlength="6">
            <button type="button" id="sendCodeBtn" onclick="sendLoginCode()">发送验证码</button>
        </div>

        <div class="radio-group">
            <input type="radio" name="loginType" value="password" checked onclick="switchLoginType('password')"> 密码登录
            <input type="radio" name="loginType" value="code" onclick="switchLoginType('code')"> 验证码登录
        </div>

        <input type="submit" value="登录">
    </form>
</div>
</body>
</html>
