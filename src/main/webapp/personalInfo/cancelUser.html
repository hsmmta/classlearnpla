<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="../css/mobile.css">
    <title>学习社区-学生端 - 注销账户</title>
    <style>
        /* 原有样式不变，无需修改 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .sidebar {
            width: 200px;
            background-color: #ffffff;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
            padding-top: 30px;
        }
        .sidebar .logo {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
        }
        .sidebar .nav-list {
            list-style: none;
        }
        .sidebar .nav-item {
            margin: 10px 0;
        }
        .sidebar .nav-item a {
            display: block;
            padding: 10px 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .sidebar .nav-item a:hover,
        .sidebar .nav-item a.active {
            background-color: #e8f4ff;
            color: #0088ff;
            font-weight: 500;
        }
        .main-content {
            margin-left: 200px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .cancel-container {
            width: 400px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.08);
        }
        .cancel-title {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 15px;
        }
        .warning-card {
            background-color: #fffbe6;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #856404;
            line-height: 1.6;
        }
        .form-item {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #0088ff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-cancel {
            background-color: #f5f5f5;
            color: #666;
        }
        .btn-cancel:hover {
            background-color: #e9e9e9;
        }
        .btn-confirm {
            background-color: #ff4d4f;
            color: white;
        }
        .btn-confirm:hover {
            background-color: #ff7875;
        }
    </style>
    <script>
        // 获取应用的根路径
        function getContextPath() {
            var pathName = window.location.pathname;
            var index = pathName.indexOf('/personalInfo');
            if (index !== -1) {
                return pathName.substring(0, index);
            }
            return '/焚决'; // 默认应用名
        }

        // 修复核心：完善请求发送、参数传递、响应处理逻辑
        function submitCancel() {
            // 1. 获取输入的密码和注销原因（密码必填）
            let password = document.getElementById("password").value.trim();
            let reason = document.getElementById("cancelReason").value.trim();

            // 2. 前端校验：密码不能为空
            if (password === "") {
                alert("请输入账号密码进行验证！");
                document.getElementById("password").focus();
                return false;
            }

            // 3. 二次确认（防误操作）
            if (!confirm("您确认要注销账号吗？注销后所有数据将永久删除，且无法恢复！")) {
                return false;
            }

            // 4. 发送异步请求（核心修复：确保参数、路径、格式正确）
            let xhr = new XMLHttpRequest();
            // 确认请求路径：必须和DeleteAccountServlet的@WebServlet("/deleteAccount")一致
            var contextPath = getContextPath();
            xhr.open("POST", window.location.origin + contextPath + "/deleteAccount", true);
            // 必须设置Content-Type，否则后端无法获取参数
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            // 5. 处理响应（核心：解析后端返回的JSON，根据结果弹窗+跳转）
            xhr.onreadystatechange = function() {
                // 仅当请求完成且响应正常时处理
                if (xhr.readyState === 4) {
                    // 先排查网络/服务器错误
                    if (xhr.status !== 200) {
                        alert("请求失败！服务器返回状态码：" + xhr.status + "，请检查后端是否启动");
                        return;
                    }

                    // 解析后端返回的JSON（关键：处理解析异常）
                    try {
                        let result = JSON.parse(xhr.responseText);
                        // 弹窗提示后端返回的信息
                        alert(result.msg);
                        // 注销成功：跳转到登录页
                        if (result.success) {
                            setTimeout(() => {
                                // 确认登录页路径正确（根据你的项目调整）
                                var contextPath = getContextPath();
                                window.location.href = window.location.origin + contextPath + "/auth/signin.html";
                            }, 1500);
                        }
                    } catch (e) {
                        alert("响应解析失败！后端返回内容：" + xhr.responseText + "，错误信息：" + e.message);
                    }
                }
            };

            // 6. 捕获网络错误（比如后端没启动、路径错误）
            xhr.onerror = function() {
                alert("网络错误！无法连接到服务器，请检查后端是否运行");
            };

            // 7. 传递参数（核心：encodeURIComponent避免中文/特殊字符乱码）
            let params = "password=" + encodeURIComponent(password) + "&reason=" + encodeURIComponent(reason);
            xhr.send(params);

            return false;
        }

        // 返回个人中心
        function goBack() {
            var contextPath = getContextPath();
            window.location.href = window.location.origin + contextPath + "/personalInfo/getUserInfo.jsp";
        }
    </script>
</head>
<body>
<div class="main-content">
    <div class="cancel-container">
        <div class="cancel-title">注销账户</div>
        <div class="warning-card">
            注意：账户注销后，所有个人数据（包括上传的资源、参与的讨论等）将被永久删除，且无法恢复。请您谨慎操作！
        </div>

        <div class="form-item">
            <label class="form-label">账号密码（必填）</label>
            <input type="password" id="password" class="form-input" placeholder="请输入您的账号登录密码">
        </div>

        <div class="btn-group">
            <button class="btn btn-cancel" onclick="goBack()">取消</button>
            <button class="btn btn-confirm" onclick="submitCancel()">确认注销</button>
        </div>
    </div>
</div>
</body>
</html>
