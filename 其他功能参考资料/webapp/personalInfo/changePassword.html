<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级学习社区平台-修改密码</title>
    <style>
        /* 全局样式统一 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 修改密码容器：匹配UI样式 */
        .password-container {
            width: 450px;
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.08);
        }
        /* 标题样式 */
        .password-title {
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
        }
        /* 输入项样式 */
        .password-item {
            margin-bottom: 20px;
        }
        .password-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .password-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .password-input:focus {
            outline: none;
            border-color: #0088ff;
        }
        /* 提交按钮样式：匹配UI的蓝色按钮 */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #0088ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #0077ee;
        }
        /* 返回按钮 */
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            text-decoration: none;
        }
        .back-btn:hover {
            color: #0088ff;
            text-decoration: underline;
        }
    </style>
    <script>
        // 前端校验 + 异步提交修改密码请求
        function submitChangePassword() {
            // 1. 获取输入值
            let oldPwd = document.getElementById("oldPassword").value.trim();
            let newPwd = document.getElementById("newPassword").value.trim();
            let confirmPwd = document.getElementById("confirmPassword").value.trim();

            // 2. 前端校验
            if (oldPwd === "") {
                alert("请输入原密码！");
                document.getElementById("oldPassword").focus();
                return false;
            }
            if (newPwd === "") {
                alert("请输入新密码！");
                document.getElementById("newPassword").focus();
                return false;
            }
            // 新密码长度校验（≥6位）
            if (newPwd.length < 6) {
                alert("新密码长度不能少于6位！");
                document.getElementById("newPassword").focus();
                return false;
            }
            if (confirmPwd === "") {
                alert("请确认新密码！");
                document.getElementById("confirmPassword").focus();
                return false;
            }
            // 新密码一致性校验
            if (newPwd !== confirmPwd) {
                alert("两次输入的新密码不一致！");
                document.getElementById("confirmPassword").focus();
                return false;
            }
            // 新密码不能和原密码相同
            if (oldPwd === newPwd) {
                alert("新密码不能和原密码相同！");
                document.getElementById("newPassword").focus();
                return false;
            }

            // 3. 构造请求参数
            let params = "oldPassword=" + encodeURIComponent(oldPwd) +
                "&newPassword=" + encodeURIComponent(newPwd);

            // 4. 异步提交请求
            let xhr = new XMLHttpRequest();
            xhr.open("POST", "/changePassword", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            let result = JSON.parse(xhr.responseText);
                            if (result.success) {
                                // 修改成功：提示 + 跳转登录页
                                alert(result.msg);
                                window.location.href = "/auth/signin.html";
                            } else {
                                // 修改失败：弹窗提示，保留在原页面
                                alert(result.msg);
                            }
                        } catch (e) {
                            alert("响应解析失败，请重试！");
                        }
                    } else {
                        alert("请求失败，HTTP状态码：" + xhr.status);
                    }
                }
            };

            // 捕获网络错误
            xhr.onerror = function() {
                alert("网络错误！修改密码请求失败");
            };

            xhr.send(params);

            // 阻止表单默认提交
            return false;
        }
    </script>
</head>
<body>
<div class="password-container">
    <div class="password-title">修改密码</div>
    <form onsubmit="return submitChangePassword()">
        <!-- 原密码 -->
        <div class="password-item">
            <label class="password-label">原密码</label>
            <input type="password" id="oldPassword" name="oldPassword" class="password-input" placeholder="请输入原登录密码">
        </div>
        <!-- 新密码 -->
        <div class="password-item">
            <label class="password-label">新密码</label>
            <input type="password" id="newPassword" name="newPassword" class="password-input" placeholder="请设置新密码（≥6位）">
        </div>
        <!-- 确认新密码 -->
        <div class="password-item">
            <label class="password-label">确认新密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="password-input" placeholder="请再次输入新密码">
        </div>
        <!-- 提交按钮 -->
        <button type="submit" class="submit-btn">提交修改</button>
    </form>
    <!-- 返回个人中心 -->
    <a href="/personalInfo/getUserInfo.jsp" class="back-btn">返回个人中心</a>
</div>
</body>
</html>
